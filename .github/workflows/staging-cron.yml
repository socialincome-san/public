# Vercel Cron only runs on production deployments, so staging gets the same jobs from here.
# Keep the schedules in sync with the crons in website/vercel.json.
name: Website / Staging cron jobs
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "0 0 * * *"
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options:
          - payment-files-import
          - exchange-rate
          - reserves-calculation
          - monthly-summary

concurrency:
  group: staging-cron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    name: Call staging cron endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⏰ Call endpoints
        env:
          BASE_URL: https://staging.socialincome.org
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "0 * * * *") jobs="payment-files-import" ;;
            "0 0 * * *") jobs="exchange-rate reserves-calculation" ;;
            "0 8 1 * *") jobs="monthly-summary" ;;
            *) jobs="$JOB" ;;
          esac

          failed=0
          for job in $jobs; do
            echo "Calling /api/v1/$job"
            curl --fail-with-body --silent --show-error --max-time 310 \
              --request POST \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/v1/$job" || failed=1
            echo
          done
          exit $failed
