name: Release

# Pushes main to production. The push uses the CI app token, so it triggers
# production-deployment.yml (Firebase rules) like any other push.

on:
  workflow_dispatch:

jobs:
  release:
    name: Push main to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - run: git push origin HEAD:production
