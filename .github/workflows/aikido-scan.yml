name: Aikido Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  aikido-local-scan-repo:
    name: "🛡️ Aikido Security Scan"
    runs-on: ubuntu-latest

    container:
      image: aikidosecurity/local-scanner:latest@sha256:03dd89c327a9696342daf43f451ba528b32c52fbd2073eac09a1eac1cbfc107d

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run scan
        run: |
          aikido-local-scanner scan ./ \
            --apikey ${{ secrets.AIKIDO_API_KEY }} \
            --repositoryname socialincome-public \
            --branchname main
